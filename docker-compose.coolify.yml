# ============================================================================
# Quackback — Coolify stack (build from source): app + MinIO
# ============================================================================
# Same app service as docker-compose.prod.yml, BUILT from the checked-out
# commit instead of pulling ghcr.io/quackbackio/quackback (the upstream image
# only moves on tagged releases and never contains a fork's commits).
#
# PostgreSQL is NOT part of this stack. It is a separate Coolify database
# resource, for three reasons:
#   - a redeploy of a compose stack restarts every service in it, the
#     database included;
#   - Coolify's scheduled backups only exist for database resources;
#   - a database inside the stack is removed with the stack, so moving or
#     rebuilding the app must not be able to take the data with it.
#
# Coolify setup (full runbook: deploy/coolify/README.md):
#   - PostgreSQL resource: image `pgvector/pgvector:pg18` — the app creates the
#     `vector` and `pg_trgm` extensions at start, and Coolify's default
#     postgres image has no pgvector. Enable scheduled backups on it.
#   - This resource: Docker Compose from this repo/branch, compose file
#     docker-compose.coolify.yml, "Connect To Predefined Network" ON so `app`
#     reaches the database by its internal hostname.
#   - Environment variables: DATABASE_URL (the database resource's internal
#     URL, password URL-encoded), BASE_URL, SECRET_KEY, MINIO_ROOT_USER,
#     MINIO_ROOT_PASSWORD, S3_BUCKET, plus email — see .env.prod.example.
#   - Attach the domain to the `app` service (container port 3000); use
#     "Force Rebuild" if a deploy ever seems to reuse stale layers.
#
# Migrations run automatically on app startup. FORK_CUTOVER=auto additionally
# runs the fork → upstream cutover once (scripts/cutover/README.md).
#
# ---------------------------------------------------------------------------
# NO DRAGONFLY / REDIS. Upstream moved jobs, KV, presence and realtime onto
# Postgres, so the Redis-compatible service this stack used to run is gone and
# REDIS_URL is no longer read. When upgrading an existing deployment, remove the
# dragonfly container and its volume AFTER cutover — nothing reads it, but the
# queue state it held is only safe to discard once the app is running on the
# Postgres job tier.
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quackback-app
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the PostgreSQL resource's internal URL}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-quackback}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      S3_PROXY: 'true'
      BASE_URL: ${BASE_URL:?set BASE_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2025-04-22T22-12-26Z}
    container_name: quackback-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the upload bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:${MC_IMAGE_TAG:-RELEASE.2025-04-16T18-13-26Z}
    container_name: quackback-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-quackback}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\"
      "
    restart: 'no'

volumes:
  minio_data:
