# ============================================================================
# Quackback — Coolify stack (build from source)
# ============================================================================
# Same stack as docker-compose.prod.yml (app + PostgreSQL + Dragonfly + MinIO),
# with ONE difference: the app service is BUILT from the checked-out commit
# instead of pulling the prebuilt ghcr.io/quackbackio/quackback image. Use this
# when deploying a fork (or unreleased commits on main) via Coolify — the
# upstream `latest` image only moves on tagged releases, so it will never
# contain your own commits.
#
# Coolify setup:
#   - Resource type: Docker Compose, pointed at this repo/branch
#   - Compose file: docker-compose.coolify.yml
#   - Fill in the same variables as .env.prod.example in Coolify's
#     "Environment Variables" tab (SECRET_KEY, BASE_URL, POSTGRES_*, MINIO_*, …)
#   - Attach your domain to the `app` service (container port 3000); use
#     "Force Rebuild" if a deploy ever seems to reuse stale layers
#
# Migrations run automatically on app startup. Keep this file in sync with
# docker-compose.prod.yml when pulling upstream changes — only the app
# service's image/build stanza should differ.
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quackback-app
    restart: unless-stopped
    init: true
    # Coolify writes its "Environment Variables" tab to a .env file next to the
    # compose file at deploy time; this carries the optional settings (email,
    # S3_REGION, …) into the container. Marked optional so the stack also runs
    # under plain `docker compose` with the variables exported in the shell.
    env_file:
      - path: .env
        required: false
    # Internal wiring is fixed here (derived from the configured secrets) so it
    # can't point at the wrong host — these override env_file. BASE_URL and
    # SECRET_KEY are re-declared with :? so a half-configured stack refuses to
    # start instead of booting broken.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quackback}
      REDIS_URL: redis://dragonfly:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-quackback}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      # MinIO has no public port, so the browser can't reach it directly:
      # serve uploads through the app's /api/storage proxy.
      S3_PROXY: 'true'
      BASE_URL: ${BASE_URL:?set BASE_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Use Bun (always in the image) so we don't depend on curl/wget. The
      # container listens on 3000 regardless of the published APP_PORT.
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-quackback}
    # No host port — Postgres is reachable only on the internal network.
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql
    # pg_cron is required for scheduled analytics/materialized-view refreshes.
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=${POSTGRES_DB:-quackback} -c max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    container_name: quackback-dragonfly
    restart: unless-stopped
    # BullMQ requires cluster_mode=emulated + lock_on_hashtags for Lua script compatibility.
    command: dragonfly --cluster_mode=emulated --lock_on_hashtags
    # No host port — reachable only on the internal network.
    volumes:
      - dragonfly_data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    container_name: quackback-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    # No host port — object storage is internal; uploads are served via the app.
    command: server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the upload bucket on first start. It does NOT set a public download
  # policy — the bucket stays private and is served through the app's
  # /api/storage proxy (S3_PROXY=true above).
  minio-init:
    image: minio/mc:${MC_IMAGE_TAG:-latest}
    container_name: quackback-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-quackback}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\"
      "
    restart: 'no'

volumes:
  postgres_data:
  minio_data:
  dragonfly_data:
